name: optifab

services:
  frontend:
    image: sohamghugare/optifab-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  backend:
    image: sohamghugare/optifab-backend
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env

volumes:
  caddy_data:
  caddy_config:
