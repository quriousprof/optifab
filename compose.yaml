name: optifab

services:
  frontend:
    image: sohamghugare/optifab-frontend
    build:
      context: ./frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  backend:
    image: sohamghugare/optifab-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    expose:
      - "8000"
    volumes:
      - ./backend:/app
      - ./docs:/app/docs

volumes:
  caddy_data:
  caddy_config:
