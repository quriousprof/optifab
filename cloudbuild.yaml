steps:
  # Build backend (context = repo root)
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - backend/Dockerfile
      - -t
      - asia-south1-docker.pkg.dev/$PROJECT_ID/optifab/backend
      - .

  # Build frontend (context = frontend/)
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - CADDYFILE=Caddyfile.cloudrun
      - -t
      - asia-south1-docker.pkg.dev/$PROJECT_ID/optifab/frontend
      - frontend/

images:
  - asia-south1-docker.pkg.dev/$PROJECT_ID/optifab/backend
  - asia-south1-docker.pkg.dev/$PROJECT_ID/optifab/frontend
