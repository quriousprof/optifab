[project]
name = "optifab-backend"
version = "0.1.0"
description = "Optifab factory digital twin backend with Cirq QAOA optimization"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "cirq-core>=1.4",
    "scipy>=1.14",
    "numpy>=2.0",
    "google-genai>=1.14",
    "google-cloud-firestore>=2.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that run QAOA with full optimization (deselect with '-m \"not slow\"')",
]
